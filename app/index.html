<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm City Poster Lab — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">PC</span>
    <div>
      <h1>Palm City Poster Lab</h1>
      <p>Turn any photo into poster cover art — offline, on your machine.</p>
    </div>
  </div>
  <div class="top-actions">
    <div class="sizes" role="group" aria-label="Cover size">
      <button id="size-square" type="button">1080 × 1080</button>
      <button id="size-portrait" type="button">1080 × 1350</button>
      <button id="size-landscape" type="button" class="active">1920 × 1080</button>
    </div>
    <button id="undo" type="button" disabled>↶ Undo</button>
    <button id="redo" type="button" disabled>↷ Redo</button>
    <button id="surprise" type="button" class="accent">✦ Surprise me</button>
  </div>
</header>

<div class="workspace">
  <aside class="rail">
    <section>
      <h2>1 · Photos</h2>
      <div id="tray" class="tray"></div>
      <label class="add-photos">+ Add your photos
        <input id="addPhotos" type="file" accept="image/*" multiple>
      </label>
      <p class="hint">Click a photo to put it in the selected frame. Drag a photo onto the preview, too. Photos never leave your machine.</p>
      <div id="panelTools" class="panel-tools" hidden>
        <p id="panelName" class="panel-name">Frame 1</p>
        <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1"> <span id="zoomVal">100%</span></label>
        <label>Pan left–right <input id="panX" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
        <label>Pan up–down <input id="panY" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
        <div class="row">
          <button id="flipBtn" type="button">Flip</button>
          <button id="resetCrop" type="button">Reset crop</button>
        </div>
      </div>
    </section>

    <section>
      <h2>2 · Layout</h2>
      <div id="layouts" class="chips"></div>
    </section>

    <section>
      <h2>3 · Grade</h2>
      <div id="grades" class="swatches"></div>
      <label class="slider">Grade strength <input id="strength" type="range" min="0" max="100" value="85"> <span id="strengthVal">85%</span></label>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
    </section>

    <section>
      <h2>4 · Words</h2>
      <label>Title <input id="title" type="text" maxlength="24" value="GOLDEN HOUR"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="chasing the last light"></label>
      <div class="stars-row"><span>Stars</span><div id="stars" class="stars"></div></div>
      <label>Badge <input id="badge" type="text" maxlength="14" value="EST. 2026"></label>
      <div id="presets" class="presets"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="canvas-wrap">
      <canvas id="cover" width="1920" height="1080" aria-label="Live cover preview"></canvas>
    </div>
  </section>
</div>

<footer class="exportbar">
  <button id="exportSquare" type="button">Export 1080 × 1080</button>
  <button id="exportPortrait" type="button">Export 1080 × 1350</button>
  <button id="exportLandscape" type="button">Export 1920 × 1080</button>
  <button id="exportAll" type="button" class="accent">Export all 3</button>
  <p id="status" role="status"></p>
</footer>

<script type="module" src="./src/main.js"></script>
</body>
</html>
